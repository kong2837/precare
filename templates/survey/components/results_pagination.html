{% if page_obj.paginator.num_pages > 1 %}
<nav class="d-flex justify-content-center align-items-center gap-3 mt-4" aria-label="설문 결과 페이지">
  {% if page_obj.has_previous %}<a class="btn btn-outline-secondary btn-sm" href="?page={{ page_obj.previous_page_number }}">← 이전</a>{% else %}<span class="btn btn-outline-secondary btn-sm disabled" aria-disabled="true">← 이전</span>{% endif %}
  <span class="small text-muted">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }} 페이지</span>
  {% if page_obj.has_next %}<a class="btn btn-outline-secondary btn-sm" href="?page={{ page_obj.next_page_number }}">다음 →</a>{% else %}<span class="btn btn-outline-secondary btn-sm disabled" aria-disabled="true">다음 →</span>{% endif %}
</nav>
{% endif %}
