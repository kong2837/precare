{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <a class="btn btn-secondary mb-2" href="javascript:history.go(-1)">목록으로</a>

  <div class="card">
    <div class="card-body">
      <div class="d-flex w-100 justify-content-between">
        <h3 class="card-title">{{ userInfo.huami.full_name }}</h3>
        <small>마지막 동기화: {{ userInfo.huami.sync_date }}</small>
      </div>

      <div class="row">
        <label for="userId" class="col-sm-2 col-form-label">유저아이디</label>
        <div class="col-sm-4">
          <input type="text" readonly class="form-control-plaintext" id="userId"
                 value="{% if userInfo.fitbit.full_name %}{{ userInfo.fitbit.full_name }}{% else %}{{ userInfo.username }}{% endif %}">
        </div>

        <label for="email" class="col-sm-2 col-form-label">Email</label>
        <div class="col-sm-4">
          <input type="text" readonly class="form-control-plaintext" id="email"
                 value="{{ userInfo.huami.email }}">
        </div>
        <hr>
      </div>

      <form action="{% url 'accounts:updateNote' userInfo.pk %}" method="post">
        {% csrf_token %}
        <div class="form-group">
          <label for="note">참고사항</label>
          <textarea class="form-control" id="note" rows="5" name="note">{{ userInfo.huami.note }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary mt-2">수정하기</button>
      </form>
    </div>

   <!-- 스트레스 점수 -->
    <div class="card-body border-top">
      <h4 class="mt-1">스트레스 점수</h4>

      <!-- 탭 -->
      <ul class="nav nav-tabs" id="stressTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link chart-link active" data-range="weekly" type="button" aria-selected="true">주간</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link chart-link" data-range="monthly" type="button" aria-selected="false">월간</button>
        </li>
      </ul>

      <div class="mt-3" id="stressWrap" style="height:360px;">
        <canvas id="stressWeekly"></canvas>
        <canvas id="stressMonthly" class="d-none"></canvas>
        <p id="stressEmpty" class="text-muted small d-none">표시할 설문 데이터가 없습니다.</p>
      </div>
    </div>

    <!-- QUIPP 점수 -->
    <div class="card-body border-top">
      <h4 class="mt-1">QUIPP 점수</h4>

      <ul class="nav nav-tabs" id="quippTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link chart-link active" data-range="weekly" type="button" aria-selected="true">주간</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link chart-link" data-range="monthly" type="button" aria-selected="false">월간</button>
        </li>
      </ul>

      <div class="mt-3" id="quippWrap" style="height:360px;">
        <canvas id="quippWeekly"></canvas>
        <canvas id="quippMonthly" class="d-none"></canvas>
        <p id="quippEmpty" class="text-muted small d-none">표시할 설문 데이터가 없습니다.</p>
      </div>
    </div>

    <!-- 조기진통 위험 점수 -->
    <div class="card-body border-top">
      <h4 class="mt-1">조기진통 위험 점수</h4>

      <ul class="nav nav-tabs" id="pretermTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link chart-link active" data-range="weekly" type="button" aria-selected="true">주간</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link chart-link" data-range="monthly" type="button" aria-selected="false">월간</button>
        </li>
      </ul>

      <div class="mt-3" id="pretermWrap" style="height:360px;">
        <canvas id="pretermWeekly"></canvas>
        <canvas id="pretermMonthly" class="d-none"></canvas>
        <p id="pretermEmpty" class="text-muted small d-none">표시할 설문 데이터가 없습니다.</p>
      </div>
    </div>

<!-- 탭 글자색을 항상 검정으로 강제 -->
<style>
  .nav.nav-tabs .chart-link,
  .nav.nav-tabs .chart-link:hover,
  .nav.nav-tabs .chart-link:focus,
  .nav.nav-tabs .chart-link.active {
    color:#000 !important;
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
(function(){
  const uid  = Number("{{ userInfo.pk }}");
  const base = "{% url 'accounts:score_data_chart' 0 %}".replace('/0/', `/${uid}/`);
  // base는 /charts/<pk> 로 해석됨. metric은 쿼리로 전달

  function drawLine(canvas, key, labels, values, labelText, scaleMax){
    if (!canvas) return;
    // canvas별 chart 인스턴스를 data-*에 저장해 관리
    if (canvas._chart) {
      canvas._chart.destroy();
      canvas._chart = null;
    }
    canvas._chart = new Chart(canvas.getContext('2d'), {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: labelText,
          data: values,
          tension: 0.2,
          pointRadius: 3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        spanGaps: true,
        scales: { y: { beginAtZero: true, max: scaleMax ?? 40 } },
        plugins: { legend: { display: true } }
      }
    });
  }

  // 각 섹션 초기화 (metric: stress|quipp|preterm)
  function initSection({metric, title, tabsId, weeklyId, monthlyId, emptyId}) {
    const tabs      = document.querySelectorAll(`#${tabsId} .chart-link`);
    const weeklyCV  = document.getElementById(weeklyId);
    const monthlyCV = document.getElementById(monthlyId);
    const emptyEl   = document.getElementById(emptyId);

    let scaleMax = 40;

    async function loadWeekly(){
      const res = await fetch(`${base}?metric=${metric}&range=weekly`, { credentials: "same-origin" });
      if (!res.ok){
        console.error('HTTP', res.status, metric);
        emptyEl.textContent = '차트를 불러오는 중 문제가 발생했습니다.';
        emptyEl.classList.remove('d-none');
        weeklyCV.classList.add('d-none');
        monthlyCV.classList.add('d-none');
        return;
      }
      const data = await res.json();
      scaleMax = data?.meta?.scale_max ?? scaleMax;

      const labels = data.labels || [];
      const values = data.values || [];
      const hasData = values.length > 0;

      emptyEl.classList.toggle('d-none', hasData);
      weeklyCV.classList.toggle('d-none', !hasData);
      monthlyCV.classList.add('d-none');

      if (!hasData){
        if (weeklyCV._chart) weeklyCV._chart.destroy();
        return;
      }
      drawLine(weeklyCV, 'weekly', labels, values, `${title}`, scaleMax);
    }

    async function loadMonthly(){
      const res = await fetch(`${base}?metric=${metric}&range=monthly`, { credentials: "same-origin" });
      if (!res.ok){
        console.error('HTTP', res.status, metric);
        emptyEl.textContent = '차트를 불러오는 중 문제가 발생했습니다.';
        emptyEl.classList.remove('d-none');
        weeklyCV.classList.add('d-none');
        monthlyCV.classList.add('d-none');
        return;
      }
      const data = await res.json();
      scaleMax = data?.meta?.scale_max ?? scaleMax;

      const labels = data.labels || [];
      const values = data.values || [];
      const hasData = values.length > 0;

      emptyEl.classList.toggle('d-none', hasData);
      monthlyCV.classList.toggle('d-none', !hasData);
      weeklyCV.classList.add('d-none');

      if (!hasData){
        if (monthlyCV._chart) monthlyCV._chart.destroy();
        return;
      }
      drawLine(monthlyCV, 'monthly', labels, values, `${title}`, scaleMax);
    }

    function activate(range){
      tabs.forEach(b => {
        const on = (b.dataset.range === range);
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      if (range === 'weekly') loadWeekly(); else loadMonthly();
    }

    tabs.forEach(btn => btn.addEventListener('click', () => activate(btn.dataset.range)));
    // 기본: 주간 먼저 보여주기
    activate('weekly');
  }

  // 스트레스 / QUIPP / 조기진통 섹션을 한 번에 초기화
  initSection({
    metric: 'stress',
    title: '스트레스 점수',
    tabsId: 'stressTabs',
    weeklyId: 'stressWeekly',
    monthlyId: 'stressMonthly',
    emptyId: 'stressEmpty'
  });

  initSection({
    metric: 'quipp',
    title: 'QUIPP 점수',
    tabsId: 'quippTabs',
    weeklyId: 'quippWeekly',
    monthlyId: 'quippMonthly',
    emptyId: 'quippEmpty'
  });

  initSection({
    metric: 'preterm',
    title: '조기진통 위험 점수',
    tabsId: 'pretermTabs',
    weeklyId: 'pretermWeekly',
    monthlyId: 'pretermMonthly',
    emptyId: 'pretermEmpty'
  });
})();
</script>

{% endblock %}
