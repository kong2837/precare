{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <a class="btn btn-secondary mb-3" href="javascript:history.go(-1)">목록으로</a>

  <div class="row">
    
    <div class="col-lg-8">
      <div class="card mb-4">
        <div class="card-body">
          <div class="d-flex w-100 justify-content-between">
            <h3 class="card-title">{{ userInfo.huami.full_name }}</h3>
            <small class="text-muted">마지막 동기화: {{ userInfo.huami.sync_date }}</small>
          </div>

          <div class="row mt-3">
            <label for="userId" class="col-sm-2 col-form-label">유저아이디</label>
            <div class="col-sm-4">
              <input type="text" readonly class="form-control-plaintext" id="userId"
                     value="{% if userInfo.fitbit.full_name %}{{ userInfo.fitbit.full_name }}{% else %}{{ userInfo.username }}{% endif %}">
            </div>

            <label for="email" class="col-sm-2 col-form-label">Email</label>
            <div class="col-sm-4">
              <input type="text" readonly class="form-control-plaintext" id="email"
                     value="{{ userInfo.huami.email }}">
            </div>
          </div>
          <hr>

          <form action="{% url 'accounts:updateNote' userInfo.pk %}" method="post">
            {% csrf_token %}
            <div class="form-group">
              <label for="note" class="fw-bold mb-1">참고사항</label>
              <textarea class="form-control" id="note" rows="3" name="note">{{ userInfo.huami.note }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary mt-2">수정하기</button>
          </form>
        </div>

        <div class="card-body border-top">
          <h4 class="mt-1">스트레스 점수</h4>
          <ul class="nav nav-tabs" id="stressTabs" role="tablist">
            <li class="nav-item">
              <button class="nav-link chart-link active" data-range="weekly" type="button">주간</button>
            </li>
            <li class="nav-item">
              <button class="nav-link chart-link" data-range="monthly" type="button">월간</button>
            </li>
          </ul>
          <div class="mt-3" id="stressWrap" style="height:320px;">
            <canvas id="stressWeekly"></canvas>
            <canvas id="stressMonthly" class="d-none"></canvas>
            <p id="stressEmpty" class="text-muted small d-none">표시할 데이터가 없습니다.</p>
          </div>
        </div>

        <div class="card-body border-top">
          <h4 class="mt-1">QUIPP 점수</h4>
          <ul class="nav nav-tabs" id="quippTabs" role="tablist">
            <li class="nav-item">
              <button class="nav-link chart-link active" data-range="weekly" type="button">주간</button>
            </li>
            <li class="nav-item">
              <button class="nav-link chart-link" data-range="monthly" type="button">월간</button>
            </li>
          </ul>
          <div class="mt-3" id="quippWrap" style="height:320px;">
            <canvas id="quippWeekly"></canvas>
            <canvas id="quippMonthly" class="d-none"></canvas>
            <p id="quippEmpty" class="text-muted small d-none">표시할 데이터가 없습니다.</p>
          </div>
        </div>

        <div class="card-body border-top">
          <h4 class="mt-1">조기진통 위험 점수</h4>
          <ul class="nav nav-tabs" id="pretermTabs" role="tablist">
            <li class="nav-item">
              <button class="nav-link chart-link active" data-range="weekly" type="button">주간</button>
            </li>
            <li class="nav-item">
              <button class="nav-link chart-link" data-range="monthly" type="button">월간</button>
            </li>
          </ul>
          <div class="mt-3" id="pretermWrap" style="height:320px;">
            <canvas id="pretermWeekly"></canvas>
            <canvas id="pretermMonthly" class="d-none"></canvas>
            <p id="pretermEmpty" class="text-muted small d-none">표시할 데이터가 없습니다.</p>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-4">
      <div id="detailSection" class="card shadow-sm sticky-top d-none" style="top: 20px;">
        <div class="card-header bg-white d-flex justify-content-between align-items-center pt-3">
          <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-info-circle me-2"></i>상세 기록</h5>
          <button type="button" class="btn-close" onclick="document.getElementById('detailSection').classList.add('d-none')"></button>
        </div>
        <div class="card-body" style="max-height: 80vh; overflow-y: auto;">
          <h6 id="detailTitle" class="text-primary fw-bold mb-3">날짜 정보</h6>
          
          <div class="mb-4">
            <h6 class="fw-bold small text-muted text-uppercase mb-2">설문 목록</h6>
            <ul id="modalSurveyList" class="list-group list-group-flush border-top border-bottom"></ul>
          </div>

          <div>
            <h6 class="fw-bold small text-muted text-uppercase mb-2">행동 요령 수행 상태</h6>
            <div id="modalActionArea"></div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<style>
  /* 탭 글자색 검정 고정 */
  .nav.nav-tabs .chart-link,
  .nav.nav-tabs .chart-link.active {
    color: #000 !important;
    font-weight: 500;
  }
  /* 스크롤바 커스텀 (오른쪽 상세 영역) */
  #detailSection .card-body::-webkit-scrollbar { width: 5px; }
  #detailSection .card-body::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
(function(){
  const uid  = Number("{{ userInfo.pk }}");
  const base = "{% url 'accounts:score_data_chart' 0 %}".replace('/0/', `/${uid}/`);

  // 1. 차트 그리기 함수 (spanGaps: true 적용)
  function drawLine(canvas, key, labels, values, labelText, scaleMax, metaData){
    if (!canvas) return;
    if (canvas._chart) canvas._chart.destroy();

    canvas._chart = new Chart(canvas.getContext('2d'), {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: labelText,
          data: values,
          borderColor: '#4e73df',
          backgroundColor: 'rgba(78, 115, 223, 0.05)',
          borderWidth: 2,
          tension: 0.3,
          pointRadius: 5,
          pointHoverRadius: 8,
          spanGaps: true, // 점 사이 선 연결
          fill: false
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: { 
          y: { 
            beginAtZero: true, 
            max: scaleMax ?? 40,
            ticks: { stepSize: 5 }
          } 
        },
        onClick: (evt, elements) => {
          if (elements.length > 0) {
            const index = elements[0].index;
            if (metaData && metaData[index]) {
              const meta = metaData[index];
              updateDetailArea(meta.start, meta.end, canvas.dataset.metric, meta.label);
            }
          }
        }
      }
    });
  }



  async function updateDetailArea(start, end, metric, dateLabel) {
    const detailUrl = `{% url 'accounts:weekly_score_detail' userInfo.pk %}?start=${start}&end=${end}&metric=${metric}`;
    try {
        const res = await fetch(detailUrl);
        const data = await res.json();
        
        const sectionEl = document.getElementById('detailSection');
        const actionArea = document.getElementById('modalActionArea');
        
        document.getElementById('detailTitle').innerText = dateLabel;
        sectionEl.classList.remove('d-none');
        
        // 기존 설문 목록(ul)은 비우고 ActionArea(통합 영역)만 사용합니다.
        document.getElementById('modalSurveyList').innerHTML = '';
        actionArea.innerHTML = '';

        if (!data.history || data.history.length === 0) {
            actionArea.innerHTML = '<p class="text-muted small">기록이 없습니다.</p>';
            return;
        }

        data.history.forEach(item => {
            const isDone = item.performed === 1;
            const statusBadge = item.has_feedback 
                ? `<span class="badge ${isDone ? 'bg-success' : 'bg-secondary'}">${isDone ? '수행' : '미수행'}</span>`
                : `<span class="badge bg-light text-dark border">기록없음</span>`;

            actionArea.innerHTML += `
                <div class="mb-4 pb-2 border-bottom">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="fw-bold text-dark" style="font-size: 0.85rem;">${item.created_at}</span>
                        <div>
                            <span class="badge bg-primary me-1">${item.score}점</span>
                            ${statusBadge}
                        </div>
                    </div>
                    <div class="p-2 rounded bg-light" style="font-size: 0.8rem;">
                        <div class="text-muted mb-1" style="font-size: 0.7rem;">[${item.title}] 안내 내용:</div>
                        <div class="fw-medium text-dark">${item.action_msg}</div>
                        ${item.action_code ? `<div class="text-end mt-1" style="font-size: 0.65rem; color: #ccc;">Code: ${item.action_code}</div>` : ''}
                    </div>
                </div>
            `;
        });
    } catch (e) {
        console.error("데이터 로드 실패:", e);
    }
}

  // 3. 섹션 초기화 로직
  function initSection({metric, title, tabsId, weeklyId, monthlyId, emptyId}) {
    const tabs      = document.querySelectorAll(`#${tabsId} .chart-link`);
    const weeklyCV  = document.getElementById(weeklyId);
    const monthlyCV = document.getElementById(monthlyId);
    const emptyEl   = document.getElementById(emptyId);
    
    weeklyCV.dataset.metric = metric;
    monthlyCV.dataset.metric = metric;

    async function loadWeekly(){
      const res = await fetch(`${base}?metric=${metric}&range=weekly`);
      const data = await res.json();
      
      const hasData = data.values && data.values.length > 0;
      emptyEl.classList.toggle('d-none', hasData);
      weeklyCV.classList.toggle('d-none', !hasData);
      monthlyCV.classList.add('d-none');

      if (hasData) {
        const enrichedMeta = data.meta.map((m, i) => ({ ...m, label: data.labels[i] }));
        drawLine(weeklyCV, 'weekly', data.labels, data.values, title, data.scale_max || 40, enrichedMeta);
      }
    }

    async function loadMonthly(){
      const res = await fetch(`${base}?metric=${metric}&range=monthly`);
      const data = await res.json();
      
      const hasData = data.values && data.values.length > 0;
      emptyEl.classList.toggle('d-none', hasData);
      monthlyCV.classList.toggle('d-none', !hasData);
      weeklyCV.classList.add('d-none');

      if (hasData) {
        drawLine(monthlyCV, 'monthly', data.labels, data.values, title, data.scale_max || 40, null);
      }
    }

    function activate(range){
      tabs.forEach(b => b.classList.toggle('active', b.dataset.range === range));
      if (range === 'weekly') loadWeekly(); else loadMonthly();
    }

    tabs.forEach(btn => btn.addEventListener('click', () => activate(btn.dataset.range)));
    activate('weekly');
  }

  initSection({ metric: 'stress', title: '스트레스 점수', tabsId: 'stressTabs', weeklyId: 'stressWeekly', monthlyId: 'stressMonthly', emptyId: 'stressEmpty' });
  initSection({ metric: 'quipp', title: 'QUIPP 점수', tabsId: 'quippTabs', weeklyId: 'quippWeekly', monthlyId: 'quippMonthly', emptyId: 'quippEmpty' });
  initSection({ metric: 'preterm', title: '조기진통 위험 점수', tabsId: 'pretermTabs', weeklyId: 'pretermWeekly', monthlyId: 'pretermMonthly', emptyId: 'pretermEmpty' });
})();
</script>
{% endblock %}
